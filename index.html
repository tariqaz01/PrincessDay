<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/cake.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A little birthday surprise made with love." />
    <link rel="preload" href="/music/Icelight.mp3" as="audio" type="audio/mpeg" />
    <title>Little Surprise 🎂</title>
  </head>
  <body>
    <!-- AUTOPLAY FIX: muted autoplay is always allowed by browsers.
         Music starts immediately (muted), then unmutes on first user touch. -->
    <audio id="bg-music" src="/music/Icelight.mp3" autoplay muted preload="auto" loop playsinline></audio>

    <div id="root"></div>

    <script>
      (function () {
        var audio = document.getElementById('bg-music');
        if (!audio) return;
        audio.volume = 0.45;
        audio.play().catch(function () {});

        var unlocked = false;
        var events = ['click', 'touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown', 'scroll'];

        function unlock() {
          if (unlocked) return;
          unlocked = true;
          audio.muted = false;
          if (audio.paused) audio.play().catch(function () {});
          events.forEach(function (e) {
            window.removeEventListener(e, unlock, true);
            document.removeEventListener(e, unlock, true);
          });
        }

        events.forEach(function (e) {
          window.addEventListener(e, unlock, { capture: true, passive: true });
          document.addEventListener(e, unlock, { capture: true, passive: true });
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
